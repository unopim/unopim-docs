        - heading "Overview Permalink to \"Overview\"" [level=2] [ref=e385]:
          - text: Overview
          - link "Permalink to \"Overview\"" [ref=e386] [cursor=pointer]:
            - /url: "#overview"
            - text: "#"
        - paragraph [ref=e387]: This guide will help you upgrade your Unopim installation to version 0.2.0. Please follow these instructions carefully to ensure a smooth upgrade process.
        - heading "Pre-upgrade Checklist Permalink to \"Pre-upgrade Checklist\"" [level=2] [ref=e388]:
          - text: Pre-upgrade Checklist
          - link "Permalink to \"Pre-upgrade Checklist\"" [ref=e389] [cursor=pointer]:
            - /url: "#pre-upgrade-checklist"
            - text: "#"
        - list [ref=e390]:
          - listitem [ref=e391]: Backup your entire project
          - listitem [ref=e392]: Backup your database
          - listitem [ref=e393]: Stop all running processes (queue workers, etc.)
        - heading "Upgrade Steps Permalink to \"Upgrade Steps\"" [level=2] [ref=e394]:
          - text: Upgrade Steps
          - link "Permalink to \"Upgrade Steps\"" [ref=e395] [cursor=pointer]:
            - /url: "#upgrade-steps"
            - text: "#"
        - heading "1. Backup Your System Permalink to \"1. Backup Your System\"" [level=3] [ref=e396]:
          - text: 1. Backup Your System
          - link "Permalink to \"1. Backup Your System\"" [ref=e397] [cursor=pointer]:
            - /url: "#_1-backup-your-system"
            - text: "#"
        - paragraph [ref=e398]: "Before proceeding, create a complete backup of your system:"
        - generic [ref=e399]:
          - button "Copy Code" [ref=e400] [cursor=pointer]
          - generic [ref=e401]: bash
          - code [ref=e403]:
            - generic [ref=e404]: "# Backup database"
            - generic [ref=e405]: mysqldump -u your_db_user -p your_db_name > unopim_backup.sql
        - heading "2. Download New Version Permalink to \"2. Download New Version\"" [level=3] [ref=e406]:
          - text: 2. Download New Version
          - link "Permalink to \"2. Download New Version\"" [ref=e407] [cursor=pointer]:
            - /url: "#_2-download-new-version"
            - text: "#"
        - paragraph [ref=e408]: "Download Unopim v0.2.0 from one of these sources:"
        - list [ref=e409]:
          - listitem [ref=e410]:
            - link "GitHub Release v0.2.0" [ref=e411] [cursor=pointer]:
              - /url: https://github.com/unopim/unopim/archive/refs/tags/v0.2.0.zip
          - listitem [ref=e412]:
            - link "Official Website" [ref=e413] [cursor=pointer]:
              - /url: https://unopim.com/download
        - heading "3. Update Project Files Permalink to \"3. Update Project Files\"" [level=3] [ref=e414]:
          - text: 3. Update Project Files
          - link "Permalink to \"3. Update Project Files\"" [ref=e415] [cursor=pointer]:
            - /url: "#_3-update-project-files"
            - text: "#"
        - paragraph [ref=e416]: Update your project files with the new version. You can do this by extracting the downloaded zip file and copying over the necessary files.
        - generic [ref=e417]:
          - button "Copy Code" [ref=e418] [cursor=pointer]
          - generic [ref=e419]: bash
          - code [ref=e421]:
            - generic [ref=e422]: "# Extract the new version"
            - generic [ref=e423]: unzip unopim-0.2.0.zip
            - generic [ref=e424]: "# Copy your environment file"
            - generic [ref=e425]: cp .env unopim-0.2.0/
            - generic [ref=e426]: "# Copy storage directory"
            - generic [ref=e427]: cp -r storage/* unopim-0.2.0/storage/
        - heading "4. Install Dependencies Permalink to \"4. Install Dependencies\"" [level=3] [ref=e428]:
          - text: 4. Install Dependencies
          - link "Permalink to \"4. Install Dependencies\"" [ref=e429] [cursor=pointer]:
            - /url: "#_4-install-dependencies"
            - text: "#"
        - paragraph [ref=e430]: "Make sure you have Composer installed. Navigate to the new Unopim directory and run:"
        - generic [ref=e431]:
          - button "Copy Code" [ref=e432] [cursor=pointer]
          - generic [ref=e433]: bash
          - code [ref=e435]:
            - generic [ref=e436]: cd unopim-0.2.0
            - generic [ref=e437]: composer install
        - heading "5. Database Updates Permalink to \"5. Database Updates\"" [level=3] [ref=e438]:
          - text: 5. Database Updates
          - link "Permalink to \"5. Database Updates\"" [ref=e439] [cursor=pointer]:
            - /url: "#_5-database-updates"
            - text: "#"
        - paragraph [ref=e440]: "If there are any new migrations or database changes, run the following command to update your database schema:"
        - generic [ref=e441]:
          - button "Copy Code" [ref=e442] [cursor=pointer]
          - generic [ref=e443]: bash
          - code [ref=e445]:
            - generic [ref=e446]: php artisan migrate
        - heading "6. Clear Cache and Optimize Permalink to \"6. Clear Cache and Optimize\"" [level=3] [ref=e447]:
          - text: 6. Clear Cache and Optimize
          - link "Permalink to \"6. Clear Cache and Optimize\"" [ref=e448] [cursor=pointer]:
            - /url: "#_6-clear-cache-and-optimize"
            - text: "#"
        - paragraph [ref=e449]: "Clear any cached configurations and optimize your application:"
        - generic [ref=e450]:
          - button "Copy Code" [ref=e451] [cursor=pointer]
          - generic [ref=e452]: bash
          - code [ref=e454]:
            - generic [ref=e455]: php artisan optimize:clear
            - generic [ref=e456]: php artisan storage:link
        - heading "7. Restart Services Permalink to \"7. Restart Services\"" [level=3] [ref=e457]:
          - text: 7. Restart Services
          - link "Permalink to \"7. Restart Services\"" [ref=e458] [cursor=pointer]:
            - /url: "#_7-restart-services"
            - text: "#"
        - paragraph [ref=e459]: If you are using a process manager like Supervisor , restart the services to apply the changes.
        - generic [ref=e460]:
          - button "Copy Code" [ref=e461] [cursor=pointer]
          - generic [ref=e462]: bash
          - code [ref=e464]:
            - generic [ref=e465]: "# If using Supervisor"
            - generic [ref=e466]: sudo supervisorctl restart unopim-worker
        - heading "Post-upgrade Steps Permalink to \"Post-upgrade Steps\"" [level=2] [ref=e467]:
          - text: Post-upgrade Steps
          - link "Permalink to \"Post-upgrade Steps\"" [ref=e468] [cursor=pointer]:
            - /url: "#post-upgrade-steps"
            - text: "#"
